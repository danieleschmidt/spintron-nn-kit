[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "spintron-nn-kit"
version = "1.0.0"
description = "Ultra-low-power neural inference via Spin-Orbit Torque (SOT) hardware with Verilog generation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "danieleschmidt", email = "danieleschmidt@users.noreply.github.com" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
]

[project.scripts]
spintron-demo = "spintron.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spintron*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
